    </g></g><g transform="translate(178 950)" stroke="#B5844E" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0 10 Q40 0 70 18 V98 Q38 82 0 92 Z M140 10 Q100 0 70 18 V98 Q102 82 140 92 Z"/><line x1="70" y1="18" x2="70" y2="98"/></g><text x="248" y="1100" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#6E6257" text-anchor="middle" style="" letter-spacing="2">ILUSTRACIÓN VECTORIAL ORIGINAL</text><rect x="455" y="447" width="12" height="34" rx="6" fill="#B5844E"/><text x="486" y="473" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#B5844E" text-anchor="start" style="" letter-spacing="3">TRAYECTORIA</text><text x="486" y="520" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">Humanista, filólogo e historiador</text><text x="486" y="559" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">murciano. Fue catedrático y enseñó</text><text x="486" y="598" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">gramática y latín.</text><rect x="455" y="672" width="12" height="34" rx="6" fill="#B5844E"/><text x="486" y="698" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#B5844E" text-anchor="start" style="" letter-spacing="3">APORTACIÓN</text><text x="486" y="745" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">Recopiló y difundió conocimiento</text><text x="486" y="784" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">sobre la historia, la lengua y la</text><text x="486" y="823" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">literatura de su época.</text><rect x="455" y="897" width="12" height="34" rx="6" fill="#B5844E"/><text x="486" y="923" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#B5844E" text-anchor="start" style="" letter-spacing="3">LEGADO</text><text x="486" y="970" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">Sus obras ayudaron a conservar la</text><text x="486" y="1009" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">memoria cultural de Murcia y anticipan</text><text x="486" y="1048" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">la tarea de organizar y transmitir</text><text x="486" y="1087" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">información fiable.</text><line x1="76" y1="1210" x2="1004" y2="1210" stroke="#B5844E" stroke-width="2" opacity=".4"/><text x="76" y="1252" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6257" text-anchor="start" style="" letter-spacing="0">Fuente: Real Academia de la Historia</text><text x="1004" y="1252" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#B5844E" text-anchor="end" style="" letter-spacing="0">01 / 06</text></svg>