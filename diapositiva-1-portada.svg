<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs>
      <radialGradient id="paper" cx="46%" cy="42%" r="78%"><stop offset="0" stop-color="#FBF5EA"/><stop offset=".72" stop-color="#F3E8D6"/><stop offset="1" stop-color="#D8C39E"/></radialGradient>
      <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="8"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
      <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#382819" flood-opacity=".18"/></filter>
    </defs><rect width="1080" height="1350" fill="#242526"/><circle cx="904" cy="145" r="230" fill="#C5A15B" opacity=".09"/><circle cx="92" cy="1195" r="300" fill="#C5A15B" opacity=".06"/><text x="90" y="130" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#C5A15B" text-anchor="start" style="" letter-spacing="3">SEMINARIO 2  ·  INFORMACIÓN Y DOCUMENTACIÓN</text><text x="90" y="342" font-family="Georgia, serif" font-size="100" font-weight="700" fill="#F7F0E4" text-anchor="start" style="" letter-spacing="0">De escribas a</text><text x="90" y="454" font-family="Georgia, serif" font-size="100" font-weight="700" fill="#F7F0E4" text-anchor="start" style="" letter-spacing="0">gestores digitales</text><text x="92" y="625" font-family="Georgia, serif" font-size="40" font-weight="400" fill="#C5A15B" text-anchor="start" style="font-style:italic" letter-spacing="0">Huellas de una profesión en Murcia</text><text x="92" y="735" font-family="Georgia, serif" font-size="34" font-weight="400" fill="#E8DED0" text-anchor="start" style="" letter-spacing="0">Seis trayectorias que muestran cómo la gestión</text><text x="92" y="785" font-family="Georgia, serif" font-size="34" font-weight="400" fill="#E8DED0" text-anchor="start" style="" letter-spacing="0">de la información ha evolucionado: del</text><text x="92" y="835" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#F7F0E4" text-anchor="start" style="" letter-spacing="0">saber humanista al dato digital.</text><line x1="92" y1="1060" x2="988" y2="1060" stroke="#C5A15B" stroke-width="4"/><circle cx="92" cy="1060" r="11" fill="#C5A15B"/><text x="92" y="1120" font-family="Georgia, serif" font-size="27" font-weight="400" fill="#F7F0E4" text-anchor="start" style="" letter-spacing="0">Siglo XVII</text><circle cx="390" cy="1060" r="11" fill="#C5A15B"/><text x="390" y="1120" font-family="Georgia, serif" font-size="27" font-weight="400" fill="#F7F0E4" text-anchor="middle" style="" letter-spacing="0">1920</text><circle cx="690" cy="1060" r="11" fill="#C5A15B"/><text x="690" y="1120" font-family="Georgia, serif" font-size="27" font-weight="400" fill="#F7F0E4" text-anchor="middle" style="" letter-spacing="0">1980</text><circle cx="988" cy="1060" r="11" fill="#C5A15B"/><text x="988" y="1120" font-family="Georgia, serif" font-size="27" font-weight="400" fill="#F7F0E4" text-anchor="end" style="" letter-spacing="0">Hoy</text><text x="92" y="1268" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9E927F" text-anchor="start" style="" letter-spacing="4">DEL SABER HUMANISTA AL DATO DIGITAL</text></svg>