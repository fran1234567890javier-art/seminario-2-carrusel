    </g></g><g transform="translate(178 950)" stroke="#9B6D64" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="12" width="124" height="88" rx="5"/><path d="M0 12h140M48 43h44v28H48z"/><line x1="55" y1="55" x2="85" y2="55"/></g><text x="248" y="1100" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#6E6257" text-anchor="middle" style="" letter-spacing="2">ILUSTRACIÓN VECTORIAL ORIGINAL</text><rect x="455" y="447" width="12" height="34" rx="6" fill="#9B6D64"/><text x="486" y="473" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9B6D64" text-anchor="start" style="" letter-spacing="3">TRAYECTORIA</text><text x="486" y="520" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">Archivera e investigadora. Ingresó en</text><text x="486" y="559" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">el Cuerpo Facultativo de Archiveros</text><text x="486" y="598" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">en 1921.</text><rect x="455" y="672" width="12" height="34" rx="6" fill="#9B6D64"/><text x="486" y="698" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9B6D64" text-anchor="start" style="" letter-spacing="3">APORTACIÓN</text><text x="486" y="745" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">Fue la primera archivera del Archivo</text><text x="486" y="784" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">de la Corona de Aragón y trabajó con</text><text x="486" y="823" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">fondos históricos de gran valor.</text><rect x="455" y="897" width="12" height="34" rx="6" fill="#9B6D64"/><text x="486" y="923" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9B6D64" text-anchor="start" style="" letter-spacing="3">LEGADO</text><text x="486" y="970" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">Abrió camino a las mujeres en los</text><text x="486" y="1009" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">archivos y contribuyó a preservar el</text><text x="486" y="1048" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#2F2923" text-anchor="start" style="" letter-spacing="0">patrimonio documental.</text><line x1="76" y1="1210" x2="1004" y2="1210" stroke="#9B6D64" stroke-width="2" opacity=".4"/><text x="76" y="1252" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6257" text-anchor="start" style="" letter-spacing="0">Fuente: Ministerio de Cultura</text><text x="1004" y="1252" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#9B6D64" text-anchor="end" style="" letter-spacing="0">02 / 06</text></svg>